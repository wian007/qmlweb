<!DOCTYPE html>
<html>
  <head>
    <title>QmlWeb: Qt 6.8-parity feature tour</title>
    <script src="../lib/qmlweb.js"></script>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 20px; }
    </style>
  </head>
  <body>
    <script type="text/qml">
      import QtQuick 2.0

      Rectangle {
        width: 860
        height: 860
        color: "#f4f4f4"

        Column {
          padding: 20
          spacing: 28

          Text {
            text: "QmlWeb: Qt 6.8-parity feature tour"
            font.pointSize: 20
            font.bold: true
          }

          // --- Rectangle per-corner radius (Qt 6.7+) ---
          Column {
            spacing: 8
            Text {
              text: "Rectangle per-corner radius (topLeftRadius, ...)"
              font.bold: true
            }
            Row {
              spacing: 20
              Rectangle {
                width: 160; height: 90; color: "#5b8def"
                topLeftRadius: 35
                bottomRightRadius: 35
              }
              Rectangle {
                width: 160; height: 90; color: "#5b8def"
                radius: 20
              }
            }
          }

          // --- Text padding ---
          Column {
            spacing: 8
            Text { text: "Text padding / leftPadding"; font.bold: true }
            Rectangle {
              color: "#ffe08a"
              width: textWithPadding.width
              height: textWithPadding.height
              Text {
                id: textWithPadding
                text: "Padded text on a colored backdrop"
                padding: 14
                leftPadding: 40
              }
            }
          }

          // --- transformOrigin ---
          Row {
            spacing: 60
            Column {
              spacing: 8
              Text { text: "transformOrigin: TopLeft"; font.bold: true }
              Rectangle {
                width: 90; height: 90; color: "#e3665d"
                rotation: 20
                transformOrigin: Item.TopLeft
              }
            }
            Column {
              spacing: 8
              Text {
                text: "transformOrigin: Center (default)"
                font.bold: true
              }
              Rectangle {
                width: 90; height: 90; color: "#e3665d"
                rotation: 20
              }
            }
          }

          // --- Positioner per-side padding ---
          Column {
            spacing: 8
            Text {
              text: "Grid with padding + leftPadding (Row/Column/Flow too)"
              font.bold: true
            }
            Rectangle {
              color: "#dcdcdc"
              width: demoGrid.width
              height: demoGrid.height
              Grid {
                id: demoGrid
                columns: 3
                padding: 16
                leftPadding: 44
                spacing: 10
                Repeater {
                  model: 6
                  Rectangle {
                    width: 44; height: 44; color: "#63b598"
                    radius: 6
                  }
                }
              }
            }
          }

          // --- Item.enabled + objectName ---
          Row {
            spacing: 20
            Rectangle {
              id: toggleBox
              objectName: "toggleBox"
              width: 180; height: 60
              radius: 8
              color: enabled ? "#63b598" : "#bbbbbb"
              enabled: true
              Text {
                anchors.centerIn: parent
                text: parent.enabled ? "enabled: true" : "enabled: false"
                color: "white"
              }
              MouseArea {
                anchors.fill: parent
                onClicked: toggleBox.enabled = !toggleBox.enabled
              }
            }
            Text {
              anchors.verticalCenter: parent.verticalCenter
              width: 320
              wrapMode: Text.WordWrap
              text: "objectName: \"" + toggleBox.objectName
                    + "\" -- click the box to toggle Item.enabled"
            }
          }
        }
      }
    </script>
  </body>
</html>
